spring.application.name=E-Commerce

# Configuración de Base de Datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db3?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuracion de JWT para la autenticacion stateless de la API.
jwt.secret=${JWT_SECRET:miClaveSecretaDeGestorCine2026ConMasDe32Caracteres}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Si se definen ambas variables, la app crea o actualiza ese usuario como ADMIN.
app.admin.email=${APP_ADMIN_EMAIL:admin@gestorcine.com}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}
